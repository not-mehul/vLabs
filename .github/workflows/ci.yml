name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  server:
    name: Server · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  client:
    name: Client · tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Mirrors what deploy/pi/install.sh does on the Pi: production deps only,
  # built SPA served by the backend, production guard rails active.
  production-smoke:
    name: Production · bare-metal smoke test
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --omit=dev
        working-directory: server
      - run: npm ci && npm run build
        working-directory: client
      - name: Boot in production mode and hit /api/health
        env:
          NODE_ENV: production
          PORT: "4000"
          HOST: 127.0.0.1
          TRUST_PROXY: "1"
          DB_PATH: ${{ runner.temp }}/vlabs.sqlite
        run: |
          export JWT_INSTRUCTOR_SECRET="$(openssl rand -hex 32)"
          export JWT_PARTICIPANT_SECRET="$(openssl rand -hex 32)"
          export SEED_INSTRUCTOR_PASSWORD="ci-only-password-$(openssl rand -hex 4)"
          node server/src/index.js > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4000/api/health && curl -fsS -o /dev/null http://127.0.0.1:4000/; then
              kill "$pid"; exit 0
            fi
            sleep 1
          done
          cat server.log
          kill "$pid" || true
          exit 1
      - name: systemd unit and Caddyfile sanity
        run: |
          systemd-analyze verify --man=no deploy/pi/vlabs.service deploy/pi/vlabs-backup.timer || true
          bash -n deploy/pi/*.sh
