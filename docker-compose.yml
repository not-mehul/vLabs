# vLabs — single-container deployment (frontend + backend + SQLite).
#
# Per the tech spec this containerises the whole app so it drops onto a single
# VM on the training-facility network. Put a TLS-terminating reverse proxy
# (nginx / Caddy / Traefik) in front for the mandatory HTTPS.
#
# Required before `docker compose up`:
#   export JWT_INSTRUCTOR_SECRET="$(openssl rand -hex 32)"
#   export JWT_PARTICIPANT_SECRET="$(openssl rand -hex 32)"
#   export SEED_INSTRUCTOR_PASSWORD="a strong first-run password"   # first start only
# (or put them in a .env file next to this compose file — never commit it).
# The `${VAR:?message}` syntax makes compose refuse to start without them, and
# the server independently refuses weak/placeholder values in production.

services:
  vlabs:
    build: .
    image: vlabs:latest
    restart: unless-stopped
    init: true
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      JWT_INSTRUCTOR_SECRET: ${JWT_INSTRUCTOR_SECRET:?Set JWT_INSTRUCTOR_SECRET (e.g. openssl rand -hex 32)}
      JWT_PARTICIPANT_SECRET: ${JWT_PARTICIPANT_SECRET:?Set JWT_PARTICIPANT_SECRET (e.g. openssl rand -hex 32)}
      SEED_INSTRUCTOR_USERNAME: ${SEED_INSTRUCTOR_USERNAME:-instructor}
      # Used only when the instructors table is empty (first start). Change the
      # password from the portal afterwards (Account → Change password).
      SEED_INSTRUCTOR_PASSWORD: ${SEED_INSTRUCTOR_PASSWORD:?Set SEED_INSTRUCTOR_PASSWORD for the first start}
      # How many reverse-proxy hops to trust for X-Forwarded-For. "1" for one
      # proxy in front of this container; leave empty when exposed directly.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # LAN pilot without TLS? Set to true (see DEPLOYMENT.md). Never on the internet.
      SERVE_PLAIN_HTTP: ${SERVE_PLAIN_HTTP:-false}
      # Same-origin in production (backend serves the SPA), so no CORS needed.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      # Persist the SQLite database across container restarts.
      - vlabs-data:/app/server/data
    stop_grace_period: 15s

volumes:
  vlabs-data:
